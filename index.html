  /** 볼록 다각형을 중심에서 바깥으로 d 만큼 키움 */
  static _grow(poly, d) {
    const c = poly.reduce((s, p) => [s[0] + p[0] / poly.length, s[1] + p[1] / poly.length], [0, 0]);
    return poly.map(([x, z]) => {
      const dx = x - c[0];
      const dz = z - c[1];
      const l = Math.hypot(dx, dz) || 1;
      return [x + dx / l * d, z + dz / l * d];
    });
  }

  // ───────────────────────────── 나무 (InstancedMesh)
  _fieldRects() {

      const f = this.layout[k];
      if (f) out.push(_Campus._grow(rectCorners(f.center, f.size, f.rotation ?? 0), 3));

  /** 나무 배치 가능 여부: 경계 안, 도로·건물·주차장·운동장에서 떨어진 곳 */
  _canPlaceTree(x, z, clearance = 2.5) {
    if (this.boundary.length && !pointInPolygon(x, z, this.boundary)) return false;
    for (const r of this.layout.roads ?? []) if (distToPolyline(x, z, r.points) < r.width / 2 + clearance) return false;
    for (const r of this.layout.publicRoads ?? []) if (distToPolyline(x, z, r.points) < r.width / 2 + 3 + clearance * 0.5) return false;
    for (const f of this.boxColliders) {
      if (x > f.minX - clearance && x < f.maxX + clearance && z > f.minZ - clearance && z < f.maxZ + clearance) {
        if (!f.poly || pointInConvex(_Campus._grow(f.poly, clearance), x, z)) return false;
      }
    }
    for (const o of this.obstacles) if (Math.hypot(x - o.x, z - o.z) < o.radius + clearance) return false;
    for (const a of this.layout.areas ?? []) {
      if ((a.kind === "parking" || a.kind === "paved") && pointInPolygon(x, z, a.points)) return false;
    }
    for (const r of this._fieldRects()) if (pointInConvex(r, x, z)) return false;
    const spawn2 = this.layout.spawn?.position;
    if (spawn2 && Math.hypot(x - spawn2[0], z - spawn2[1]) < 6) return false;
    return true;
  }
  _collectTreeSpecs() {
    const specs = [];
    const add = (x, z, type, seed2, clearance) => {
      if (!this._canPlaceTree(x, z, clearance)) {
        this.stats.treesSkipped++;
        return;
      }
      const scale = 0.85 + hash(seed2 + 7) * 0.45;
      specs.push({ x, z, type, variant: Math.floor(hash(seed2) * 4), scale, rot: hash(seed2 + 3) * Math.PI * 2 });
      this.obstacles.push({ x, z, radius: 0.45 * scale, kind: "tree" });
    };
    const cfg = this.layout.trees ?? {};
    let seed = 1;
    (cfg.points ?? []).forEach((p) => add(p.position[0], p.position[1], p.type ?? "round", seed++, 1.2));
    (cfg.rows ?? []).forEach((row) => {
      const [ax, az] = row.from;
      const [bx, bz] = row.to;
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, bz - az) / row.spacing));
      for (let i = 0; i <= n; i++) add(ax + (bx - ax) * i / n, az + (bz - az) * i / n, row.type ?? "round", seed++, 1.2);
    });
    (cfg.fill ?? []).forEach((zone) => {
      const xs = zone.points.map((p) => p[0]);
      const zs = zone.points.map((p) => p[1]);
      for (let x = Math.min(...xs); x <= Math.max(...xs); x += zone.spacing) {
        for (let z = Math.min(...zs); z <= Math.max(...zs); z += zone.spacing) {
          const jx = x + (hash(seed) - 0.5) * zone.spacing * 0.7;
          const jz = z + (hash(seed + 5) - 0.5) * zone.spacing * 0.7;
          if (pointInPolygon(jx, jz, zone.points)) add(jx, jz, hash(seed + 9) < 0.25 ? "conifer" : "round", seed, 1);
          seed++;
        }
      }
    });
    const ws = cfg.westStrip;
    const rw = this.layout.railway;
    if (ws && rw) {
      const [a, b] = rw.points;
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const ux = (b[0] - a[0]) / len;
      const uz = (b[1] - a[1]) / len;
      const nx = -uz;
      const nz = ux;
      const east = nx > 0 ? 1 : -1;
      for (const off of [rw.width / 2 + 6, rw.width / 2 + 6 + ws.width]) {
        for (let t = 0; t < len; t += ws.spacing) {
          const j = (hash(seed) - 0.5) * 3;
          add(a[0] + ux * t + nx * east * (off + j), a[1] + uz * t + nz * east * (off + j), hash(seed + 2) < 0.4 ? "conifer" : "round", seed, 2);
          seed++;
        }
      }
    }
    return specs;
  }
  _createTrees() {

    const round = specs.filter((s) => s.type !== "conifer");
    const conifer = specs.filter((s) => s.type === "conifer");

      leaves.setMatrixAt(i * 5, dummy.matrix);
      leaves.setColorAt(i * 5, color);
      dummy.position.set(s.x + Math.cos(s.rot) * 0.7 * s.scale, 3.2 * s.scale, s.z + Math.sin(s.rot) * 0.7 * s.scale);
      dummy.scale.setScalar(s.scale * 0.6);
      dummy.updateMatrix();
      leaves.setMatrixAt(i * 5 + 1, dummy.matrix);
      leaves.setColorAt(i * 5 + 1, color);
      for (let k = 2; k < 5; k++) {
        const a = s.rot + k * 2.1;
        dummy.position.set(s.x + Math.cos(a) * s.scale, 2.65 * s.scale, s.z + Math.sin(a) * s.scale);
        dummy.scale.setScalar(s.scale * 0.76);
        dummy.updateMatrix();
        leaves.setMatrixAt(i * 5 + k, dummy.matrix);
        leaves.setColorAt(i * 5 + k, color);
      }
    });
    const tiers = [[1.9, 1], [3, 0.78], [4, 0.55]];
    const cones = new THREE7.InstancedMesh(this.geos.coniferCone, this.mats.leaves, Math.max(1, conifer.length * 3));
    cones.count = conifer.length * 3;
    conifer.forEach((s, i) => {
      color.set(PALETTE.conifer[s.variant % PALETTE.conifer.length]);
      tiers.forEach(([y, k], t) => {
        dummy.position.set(s.x, y * s.scale, s.z);
        dummy.rotation.set(0, s.rot, 0);
        dummy.scale.setScalar(s.scale * k);
        dummy.updateMatrix();
        cones.setMatrixAt(i * 3 + t, dummy.matrix);
        cones.setColorAt(i * 3 + t, color);

      m.receiveShadow = true;
      m.userData.kind = "trees";
      this.groups.trees.add(m);

  }
  // ───────────────────────────── 화단
  /**

  createFlowerBed(width, depth, seed = 0) {

    this.maxHeightOffset = maxHeightOffset;

    this.zoomSensitivity = zoomSensitivity;

    this.rotateSmoothing = rotateSmoothing;
    this.zoomSmoothing = zoomSmoothing;

  /** lookAt → desired 구간에서 장애물에 처음 닿는 비율 (닿지 않으면 1) */
  _obstacleFractionFor(from, to) {
    if (this.obstacles.length === 0) return 1;
    const m = this.collisionMargin;
    const steps = 24;
    for (let i = 1; i <= steps; i++) {

  /** 점이 볼록 다각형 안이거나 margin 이내인지 */
  static _nearPoly(x, z, margin, poly) {
    let sign = 0;
    let inside = true;
    let minD = Infinity;
    for (let i = 0; i < poly.length; i++) {
      const [x1, z1] = poly[i];
      const [x2, z2] = poly[(i + 1) % poly.length];
      const c = (x2 - x1) * (z - z1) - (z2 - z1) * (x - x1);
      if (c !== 0) {
        if (sign === 0) sign = Math.sign(c);
        else if (Math.sign(c) !== sign) inside = false;
      }
      const dx = x2 - x1;
      const dz = z2 - z1;
      const t = Math.max(0, Math.min(1, ((x - x1) * dx + (z - z1) * dz) / (dx * dx + dz * dz || 1)));
      minD = Math.min(minD, Math.hypot(x - (x1 + dx * t), z - (z1 + dz * t)));
    }
    return inside || minD < margin;
  }
  _computeDesired() {
    if (this.firstPerson) {
      // 눈 위치 = 카메라 위치, 시선 = 진행 방향(-sin yaw, -cos yaw) + pitch
      const cp = Math.cos(this.pitch);
      // 눈을 캐릭터 오른쪽 어깨 바로 뒤에 둔다 → 시야는 1인칭처럼 열리고 화면 왼쪽 아래에 내 캐릭터가 보인다
      const fwd = -0.85;
      const side = 0.42;
      this._desired.set(
        this.focus.x - Math.sin(this.yaw) * fwd + Math.cos(this.yaw) * side,
        this.focus.y + this.eyeHeight + 0.12,
        this.focus.z - Math.cos(this.yaw) * fwd - Math.sin(this.yaw) * side
      );
      // 벽·건물에 카메라가 파묻히지 않게: 머리 → 카메라 구간에서 장애물이 있으면 머리 쪽으로 당김
      this._fpHead ??= new THREE11.Vector3();
      this._fpHead.set(this.focus.x, this.focus.y + this.eyeHeight, this.focus.z);
      const f = this._obstacleFractionFor(this._fpHead, this._desired);
      if (f < 1) this._desired.lerpVectors(this._fpHead, this._desired, f);
      // 좁은 곳에서 카메라가 머리에 너무 붙으면 머리를 잠시 숨겨 시야 확보
      this._fpHeadObj ??= this.target.getObjectByName?.("head");
      if (this._fpHeadObj) this._fpHeadObj.visible = f >= 0.45;
      this._lookAt.set(
        this._desired.x - Math.sin(this.yaw) * cp,
        this._desired.y + Math.sin(this.pitch),
        this._desired.z - Math.cos(this.yaw) * cp
      );
      return;
    }
    const d = this.distance * this.zoom;
    const h = this.height * this.zoom;
    this._lookAt.set(this.focus.x, this.focus.y + this.lookAtHeight, this.focus.z);
    this._desired.set(
      this.focus.x + Math.sin(this.yaw) * d,
      this.focus.y + h,
      this.focus.z + Math.cos(this.yaw) * d
    );
  }
  _apply() {
    const pos = this.camera.position;
    pos.lerpVectors(this._lookAt, this._desired, this.obstacleFraction);
    const minY = this.focus.y + this.minCameraHeight;
    const maxY = this.focus.y + this.maxHeightOffset;
    if (pos.y < minY) pos.y = minY;
    if (pos.y > maxY) pos.y = maxY;
    this.camera.lookAt(this._lookAt);
  }
  /** 보간 없이 즉시 목표 위치로 (시작/순간이동 시) */
  snap() {
    this.focus.copy(this.target.position);
    this.yaw = this.targetYaw;
    this.zoom = this.targetZoom;
    this.distance = this._profileTarget.distance;
    this.height = this._profileTarget.height;
    this.lookAtHeight = this._profileTarget.lookAtHeight;
    this._computeDesired();
    if (this.firstPerson) {
      this.pitch = this.targetPitch;
      this.obstacleFraction = 1;
      this.camera.position.copy(this._desired);
      this.camera.lookAt(this._lookAt);
      return;
    }
    this.obstacleFraction = this._obstacleFractionFor(this._lookAt, this._desired);
    this._apply();
  }
  update(delta) {
    if (!this.enabled) return;
    if (this.firstPerson) {
      this.focus.copy(this.target.position);
      this.yaw += (this.targetYaw - this.yaw) * damp2(this.rotateSmoothing, delta);
      this.pitch += (this.targetPitch - this.pitch) * damp2(this.rotateSmoothing, delta);
      this._computeDesired();
      this.obstacleFraction = 1;
      this.camera.position.copy(this._desired);
      this.camera.lookAt(this._lookAt);
      return;
    }
    this.focus.lerp(this.target.position, damp2(this.followSmoothing, delta));
    this.yaw += (this.targetYaw - this.yaw) * damp2(this.rotateSmoothing, delta);
    this.zoom += (this.targetZoom - this.zoom) * damp2(this.zoomSmoothing, delta);
    const pt = this._profileTarget;
    const k = damp2(this.profileSmoothing, delta);
    this.distance += (pt.distance - this.distance) * k;
    this.height += (pt.height - this.height) * k;
    this.lookAtHeight += (pt.lookAtHeight - this.lookAtHeight) * k;
    this._computeDesired();
    const f = this._obstacleFractionFor(this._lookAt, this._desired);
    this.obstacleFraction = f < this.obstacleFraction ? f : this.obstacleFraction + (f - this.obstacleFraction) * damp2(4, delta);
    this._apply();
  }
  dispose() {
    const el = this.domElement;
    if (!el) return;
    el.removeEventListener("pointerdown", this._onPointerDown);
    el.removeEventListener("pointermove", this._onPointerMove);
    el.removeEventListener("pointerup", this._onPointerUp);
    el.removeEventListener("pointercancel", this._onPointerUp);
    el.removeEventListener("wheel", this._onWheel);
    el.removeEventListener("contextmenu", this._onContextMenu);
  }
};

  }
  // ───────────────────────────── 모바일 조작
  _initJoystick() {
    const { hud: hud2, playerController: playerController2 } = this.d;
    const joy = hud2.el.querySelector(".tour-joy");
    const knob = joy.querySelector("i");
    let jx = 0;
    let jz = 0;
    const origInput = playerController2.getInputVector.bind(playerController2);
    playerController2.getInputVector = () => Math.hypot(jx, jz) > 0.08 ? { x: jx, z: jz } : origInput();
    const move = (e) => {
      const r = joy.getBoundingClientRect();
      const x = (e.clientX - r.left - r.width / 2) / 36;
      const y = (e.clientY - r.top - r.height / 2) / 36;
      const l = Math.max(1, Math.hypot(x, y));
      jx = x / l;
      jz = -y / l;
      knob.style.transform = `translate(${jx * 36}px,${-jz * 36}px)`;
    };
    joy.onpointerdown = (e) => {
      joy.setPointerCapture(e.pointerId);
      move(e);
    };
    joy.onpointermove = (e) => {
      if (joy.hasPointerCapture(e.pointerId)) move(e);
    };
    joy.onpointerup = joy.onpointercancel = joy.onlostpointercapture = () => {
      jx = jz = 0;
      knob.style.transform = "";
    };
    this.joystick = { set: (x, z) => {
      jx = x;
      jz = z;
    } };
    const run = hud2.el.querySelector(".tour-run");
    run.onpointerdown = () => {
      playerController2.setRunHeld(true);
      run.classList.add("is-on");
    };
    run.onpointerup = run.onpointercancel = run.onpointerleave = () => {
      playerController2.setRunHeld(false);
      run.classList.remove("is-on");
    };
  }

    start.className = "tour-start";

    uiRoot2.append(start);
    this.startScreen = start;
    state2.panelOpen = true;
    this.d.refreshGameplay();
    start.querySelector("button").onclick = () => {
      const c = new CharacterModel({ colors: { shirt: +start.querySelector("select").value } });
      player2.setModel(c.root, new CharacterAnimator(c.rig));
      hud2.el.querySelector(".hud__logo").append(document.createTextNode(" \xB7 " + (start.querySelector("input").value || "\uD0D0\uD5D8\uC0DD")));
      start.remove();
      this.startScreen = null;
      state2.panelOpen = false;
      this.d.refreshGameplay();
    };
  }
  /** 주기적 갱신 (0.2초마다): 미니맵, 출입구 근처 방문 기록 */
  tick() {
    const { campus: campus2, player: player2, state: state2 } = this.d;
    this.minimap.draw();
    if (!state2.indoor) {
      for (const b of campus2.buildings) {
        if (b.type === "gate") continue;
        const e = b.getEntrancePosition();
        if (Math.hypot(e.x - player2.position.x, e.z - player2.position.z) < 3.5) this.record(b.name);
      }
    }
  }

  onInteract: () => interactionManager.interact(),
  onFloorSelect: (floor) => onElevatorFloor(floor)
});
hud.setCameraMode("normal");
hud.show();
function refreshGameplay() {
  const enabled = !state.overview && !state.busy && !state.panelOpen;
  playerController.setEnabled(enabled);
  interactionManager.setEnabled(enabled);
}
function applyGraphics(next = {}) {
  Object.assign(settings, next);
  const r = sceneManager.renderer;
  r.setPixelRatio(Math.min(window.devicePixelRatio, settings.quality));
  const sun = sceneManager.lights.sun;
  const size = settings.quality < 1 ? Math.min(settings.shadow, 1024) : settings.shadow;
  r.shadowMap.enabled = size > 0;
  if (size > 0 && sun.shadow.mapSize.x !== size) {
    sun.shadow.mapSize.set(size, size);
    sun.shadow.map?.dispose?.();
    sun.shadow.map = null;
  }
  campus.setOutsideVisible(settings.detail > 0 && !state.indoor);
}
/** 1인칭일 때는 머리만 숨기고 몸·팔다리는 보이게, 카메라 근평면도 가깝게 */
function setFirstPersonBody(first) {
  const cam = cameraManager.getCamera();
  cam.near = first ? 0.1 : 0.5;
  cam.updateProjectionMatrix();
}
function applyCameraProfile({ immediate = false } = {}) {
  const first = state.playMode === "first";
  playerController.turnMode = first;
  playerController.onTurn = (amount) => {
    cameraFollow.targetYaw -= amount;
  };
  if (first) {
    if (!cameraFollow.firstPerson) cameraFollow.setFirstPerson(true, { eyeHeight: Math.min(player.height * 0.94, 1.68) });
    setFirstPersonBody(!state.overview);
    return;
  }
  if (cameraFollow.firstPerson) cameraFollow.setFirstPerson(false);
  setFirstPersonBody(false);
  cameraFollow.setProfile(CAMERA_PROFILES[state.indoor ? "indoor" : "outdoor"][state.playMode], { immediate });
}
function setPlayMode(mode) {
  if (state.overview) setOverviewMode(false);
  state.playMode = mode;
  applyCameraProfile();
  hud.setCameraMode(mode);
}
function setFog([near, far]) {
  sceneManager.scene.fog.near = near;
  sceneManager.scene.fog.far = far;
}
function setOverviewMode(enabled) {
  if (state.busy || enabled === state.overview) return;
  state.overview = enabled;
  if (enabled) {
    infoPanel.close();
    hud.hideFloorSelector(false);
    state.panelOpen = false;
    player.velocity.set(0, 0, 0);
    if (state.indoor) {
      state.indoor.setActive(false);
      state.indoor.building.setExteriorVisible(true);
    }
    cameraFollow.setEnabled(false);
    setFirstPersonBody(false);
    overviewCamera.reset();
    overviewCamera.setEnabled(true);
    cameraManager.setController(overviewCamera, { blend: MODE_BLEND });
    setFog(FOG.overview);
    campus.setLabelsVisible(true);
    campus.setLabelScale(2.6);
    campus.setOutsideVisible(settings.detail > 0);
    hud.setModeMessage("\uC804\uCCB4 \uC870\uAC10 \u2014 \uB4DC\uB798\uADF8 \uD68C\uC804 \xB7 \uD720 \uD655\uB300 \xB7 \uAC74\uBB3C \uD074\uB9AD \uC120\uD0DD \xB7 M \uD0A4 \uBCF5\uADC0");
    hud.setMapHelp("\uC774\uC804 \uC2DC\uC810\uC73C\uB85C");
    hud.setCameraMode("overview");
  } else {
    overviewCamera.setEnabled(false);
    cameraFollow.setEnabled(true);
    if (state.indoor) {
      state.indoor.setActive(true);
      state.indoor.building.setExteriorVisible(false);
    }
    cameraManager.setController(cameraFollow, { blend: MODE_BLEND });
    setFog(FOG.play);
    campus.setLabelScale(1);
    campus.setLabelsVisible(!state.indoor);
    campus.setOutsideVisible(settings.detail > 0 && !state.indoor);
    hud.setModeMessage(null);
    hud.setMapHelp("\uCEA0\uD37C\uC2A4 \uC804\uCCB4 \uBCF4\uAE30");
    setFirstPersonBody(state.playMode === "first");
    hud.setCameraMode(state.playMode);
  }
  refreshGameplay();
}
var onModeKey = (e) => {
  if (e.repeat) return;
  if (e.code === "KeyM") setOverviewMode(!state.overview);
  if (e.code === "KeyV" && !state.overview) setPlayMode(state.playMode === "normal" ? "wide" : "normal");
  if (e.code === "KeyF" && !state.overview) setPlayMode(state.playMode === "first" ? "normal" : "first");
};
window.addEventListener("keydown", onModeKey);
sceneManager.addResizeListener((w, h) => cameraManager.resize(w, h));
function outdoorTargets() {
  return [...interiors.values()].map((it) => ({
    id: `enter:${it.id}`,
    type: "enter",
    label: { title: it.name, lines: [`${it.building.number}\uBC88 \uAC74\uBB3C \xB7 \uC9C0\uC0C1 ${it.topFloor}\uCE35`], action: "\uB4E4\uC5B4\uAC00\uAE30" },
    position: it.building.getEntrancePosition(1).setY(0),
    radius: 2.6,
    payload: { interiorId: it.id }
  }));
}
function placePlayer(position, rotationY) {
  player.position.copy(position);
  player.velocity.set(0, 0, 0);
  player.root.rotation.y = rotationY;
  cameraFollow.setYaw(rotationY + Math.PI, true);
}
function enterBuilding(interior) {
  state.busy = true;
  refreshGameplay();
  hud.fade(() => {
    state.indoor = interior;
    interior.setActive(true);
    interior.building.setExteriorVisible(false);
    campus.setLabelsVisible(false);
    campus.setOutsideVisible(false);
    const entry = interior.getEntryPoint();
    placePlayer(entry.position, entry.rotationY);
    interior.updateVisibility(player.position.y);
    cameraFollow.setObstacles(interior.getCameraObstacles());
    applyCameraProfile({ immediate: true });
    cameraFollow.snap();
    interactionManager.unregisterPrefix("enter:");
    interactionManager.registerAll(interior.getInteractionTargets());
  }).then(() => {
    state.busy = false;
    refreshGameplay();
  });
}
function exitBuilding() {
  const interior = state.indoor;
  state.busy = true;
  refreshGameplay();
  hud.fade(() => {
    interactionManager.unregisterPrefix(`${interior.id}:`);
    interior.setActive(false);
    interior.building.setExteriorVisible(true);
    state.indoor = null;
    campus.setLabelsVisible(true);
    campus.setOutsideVisible(settings.detail > 0);
    placePlayer(interior.building.getEntrancePosition(1.6).setY(0), interior.building.getEntranceFacing());
    cameraFollow.setObstacles(campus.getCameraObstacles());
    applyCameraProfile({ immediate: true });
    cameraFollow.snap();
    interactionManager.registerAll(outdoorTargets());
  }).then(() => {
    state.busy = false;
    refreshGameplay();
  });
}
function onElevatorFloor(floor) {
  if (floor === null) {
    state.panelOpen = false;
    refreshGameplay();
    return;
  }
  const interior = state.indoor;
  state.busy = true;
  state.panelOpen = false;
  refreshGameplay();
  hud.fade(() => {
    const p = interior.getElevatorPoint(floor);
    placePlayer(p.position, p.rotationY);
    interior.updateVisibility(player.position.y);
    cameraFollow.snap();
  }, { duration: 380 }).then(() => {
    state.busy = false;
    refreshGameplay();
  });
}
interactionManager.registerAll(outdoorTargets());
interactionManager.onFocusChange = (target) => target ? hud.showPrompt(target.label) : hud.hidePrompt();
interactionManager.onInteract = (target) => {
  if (state.busy) return;
  if (target.type === "enter" || target.type === "room") tourUI.record(target.label.title);
  const interior = interiors.get(target.payload.interiorId);
  if (target.type === "enter") enterBuilding(interior);
  else if (target.type === "exit") exitBuilding();
  else if (target.type === "elevator") {
    state.panelOpen = true;
    refreshGameplay();
    hud.showFloorSelector(interior.floorNumbers, interior.floorAt(player.position.y));
  } else if (target.type === "room") {
    state.panelOpen = true;
    refreshGameplay();
    infoPanel.openRoom(interior.getRoomInfo(target.payload.id), interior.name);
  }
};
var tourUI = new TourUI({
  hud,
  uiRoot,
  campus,
  player,
  playerController,
  cameraFollow,
  sceneManager,
  state,
  settings,
  refreshGameplay,
  setOverviewMode,
  applyGraphics
});
applyGraphics();
refreshGameplay();
var lastLocation = "";
function updateLocation() {
  let text = "\uCCAD\uC554\uB300\uD559\uAD50 \uCEA0\uD37C\uC2A4";
  const it = state.indoor;
  if (it) {
    const y = player.position.y;
    const f = it.floorAt(y);
    text = Math.abs(y - it.floorY(f)) > 0.05 ? `${it.name} \uACC4\uB2E8 (${f}\uCE35 \u2194 ${f + 1}\uCE35)` : `${it.name} ${f}\uCE35`;
  } else {
    let best = null;
    let bd = 15;
    for (const b of campus.buildings) {
      if (b.type === "gate") continue;
      const e = b.getEntrancePosition(1);
      const d = Math.hypot(e.x - player.position.x, e.z - player.position.z);
      if (d < bd) {
        bd = d;
        best = b;
      }
    }
    if (best) text = `${best.name} \uC55E`;
  }
  if (text !== lastLocation) {
    hud.setLocation(text);
    lastLocation = text;
  }
}
var bounds = campus.getBounds();
var campusCenter = { x: (bounds.minX + bounds.maxX) / 2, z: (bounds.minZ + bounds.maxZ) / 2 };
var uiTimer = 0;
sceneManager.addUpdater((delta, elapsed) => {
  playerController.update(delta);
  player.update(delta);
  cameraManager.update(delta);
  campus.update(delta, elapsed);
  interactionManager.update();
  if (state.indoor && !state.overview) state.indoor.updateVisibility(player.position.y);
  updateLocation();
  campus.updateDetail(cameraManager.getCamera().position, state.overview);
  if (state.overview) sceneManager.setShadowArea(campusCenter.x, campusCenter.z, 290);
  else sceneManager.setShadowArea(player.position.x, player.position.z, 60);
  uiTimer += delta;
  if (uiTimer > 0.2) {
    uiTimer = 0;
    tourUI.tick();
  }
});
sceneManager.start();
campus.loadModels(assetManager);
if (void 0) {
  (void 0).dispose(() => {
    window.removeEventListener("keydown", onModeKey);
    playerController.dispose();
    cameraFollow.dispose();
    interactionManager.dispose();
    infoPanel.dispose();
    hud.el.remove();
    infoPanel.el.remove();
    sceneManager.dispose();
    assetManager.dispose();
  });
}
if (define_import_meta_env_default.DEV) {
  window.__campusTour = {
    sceneManager,
    cameraManager,
    assetManager,
    campus,
    collisionManager,
    interiors,
    interactionManager,
    overviewCamera,
    player,
    playerController,
    cameraFollow,
    hud,
    infoPanel,
    tourUI,
    state,
    settings,
    setOverviewMode,
    setPlayMode,
    CAMERA_PROFILES
  };
}

document.getElementById('boot-msg')?.remove();
</script>
